<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas RTS</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: sans-serif;
    }
    
    canvas {
      display: block;
    }

    #top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column; 
      gap: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #4a5568;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    
    .top-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 20px;
    }

    #dev-btn {
      background: #2d3748;
      color: white;
      border: 1px solid #718096;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #build-menu-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(26, 32, 44, 0.9);
      color: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #4a5568;
      width: 250px;
      box-sizing: border-box;
      max-height: 80vh;
      overflow-y: auto;
    }

    #build-menu-header {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      font-weight: bold;
    }

    #build-menu-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    #build-menu-content button {
      background: #2d3748;
      color: white;
      border: 1px solid #718096;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: background 0.2s;
      width: 100%;
      text-align: left;
    }

    #build-menu-content button:hover {
      background: #4a5568;
    }

    #build-menu-content button.danger {
      background: #9b2c2c;
      border-color: #f56565;
      text-align: center;
      margin-top: 5px;
    }
    
    #build-menu-content button.danger:hover {
      background: #c53030;
    }

    #build-menu-content button.cancel {
      text-align: center;
    }

    #canvas-tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid #4a5568;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none; 
      display: none;
      z-index: 50;
      white-space: nowrap;
    }

    #build-confirm-ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 30px;
      z-index: 100;
    }

    #build-confirm-ui button {
      width: 60px;
      height: 60px;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    #build-confirm-btn {
      background-color: #48bb78; /* Green */
    }

    #build-confirm-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #build-cancel-btn {
      background-color: #f56565; /* Red */
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="top-bar-row">
      <span id="resource-display">Loading resources...</span>
      <button id="scene-toggle-btn" onclick="window.sceneManager.toggleScene()" style="background: #3182ce; color: white; border: 1px solid #2b6cb0; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">View World Map</button>
      <button id="dev-btn" onclick="toggleDevMode()">Dev Mode: OFF</button>
    </div>
  </div>

  <div id="canvas-tooltip"></div>

  <div id="build-confirm-ui">
    <button id="build-cancel-btn" onclick="structureManager.cancelAction()">✕</button>
    <button id="build-confirm-btn" onclick="structureManager.placeBuilding()">✓</button>
  </div>

  <canvas id="myCanvas"></canvas>

  <div id="hex-panel" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(26, 32, 44, 0.98); color: white; padding: 20px; border-radius: 8px; font-family: sans-serif; width: 350px; border: 1px solid #4a5568; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #4a5568; padding-bottom: 10px; margin-bottom: 10px;">
      <h3 id="hex-panel-title" style="margin: 0;">Hex Details</h3>
      <button onclick="window.worldMap.closeDeployMenu()" style="background: #e53e3e; border: none; color: white; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold;">X</button>
    </div>
    <p id="hex-coords" style="color: #a0aec0; font-size: 13px; margin: 0 0 10px 0; text-align: center;"></p>

    <div id="hex-content-empty" style="display: none;">
      <div style="background: #2d3748; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #4a5568;">
        <h4 id="deploy-mission-name" style="margin: 0 0 5px 0; color: #fbd38d;">Mission Name</h4>
        <div style="font-size: 13px; margin-bottom: 8px; line-height: 1.4;">
          Difficulty: <span id="deploy-mission-diff" style="color: #ecc94b"></span><br>
          Duration: <b id="deploy-mission-time"></b> | Required: <span id="deploy-mission-reqs" style="color: #fc8181; font-weight: bold;"></span>
        </div>
      </div>

      <div style="margin-bottom: 15px; color: #63b3ed; font-size: 13px; text-align: center;">
        Available: <b id="deploy-avail-s">0</b> Soldiers | <b id="deploy-avail-m">0</b> Medics
      </div>

      <div style="display: flex; justify-content: space-between; gap: 10px; align-items: center; background: #1a202c; padding: 10px; border-radius: 6px; border: 1px solid #4a5568;">
        <label style="font-size: 12px; display: flex; flex-direction: column; gap: 4px;">
          Assign Soldiers:
          <input type="number" id="world-deploy-s" min="0" value="0" style="width: 60px; background: #2d3748; color: white; border: 1px solid #718096; padding: 6px; border-radius: 4px;">
        </label>
        <label style="font-size: 12px; display: flex; flex-direction: column; gap: 4px;">
          Assign Medics:
          <input type="number" id="world-deploy-m" min="0" value="0" style="width: 60px; background: #2d3748; color: white; border: 1px solid #718096; padding: 6px; border-radius: 4px;">
        </label>
      </div>
      <p id="no-gunships-warning-empty" style="color: #fc8181; font-size: 13px; text-align: center; display: none; font-weight: bold; margin-top: 10px;">No available gunships.</p>
      <button id="send-gunship-btn" onclick="window.worldMap.deployGunship()" style="width: 100%; background: #48bb78; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 15px;">Send Gunship</button>
    </div>

    <div id="hex-content-held" style="display: none; text-align: center;">
      <div style="background: #276749; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #48bb78;">
        <h4 style="margin: 0 0 10px 0; color: #9ae6b4;">Territory Secured</h4>
        <div style="font-size: 14px; margin-bottom: 5px;">Garrison:</div>
        <div style="font-weight: bold; font-size: 16px;">
          <span id="held-s-count">0</span> Soldiers | <span id="held-m-count">0</span> Medics
        </div>
      </div>
      <p id="no-gunships-warning-held" style="color: #fc8181; font-size: 13px; text-align: center; display: none; font-weight: bold; margin-top: 10px;">No available gunships.</p>
      <button id="recall-troops-btn" onclick="window.worldMap.recallTroops()" style="width: 100%; background: #ecc94b; color: #1a202c; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px;">Recall Troops</button>
    </div>

    <div id="hex-content-active" style="display: none; text-align: center;">
      <div style="background: #2d3748; padding: 15px; border-radius: 6px; border: 1px solid #e53e3e;">
        <h4 id="active-state-title" style="margin: 0 0 10px 0; color: #fc8181;">Deployment Active</h4>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;" id="hex-timer-display">00:00</div>
        <div style="font-size: 13px; color: #a0aec0;">Time Remaining</div>
      </div>
    </div>
  </div>

  <div id="build-menu-container">
    <div id="build-menu-header" onclick="toggleBuildMenu()">
      <span>Build Structures</span> <span id="build-toggle">▶</span>
    </div>
    <div id="build-menu-content" style="display: none;">
      <button onclick="structureManager.startBuilding('HEADQUARTERS')">HQ (St:400)</button>
      <button onclick="structureManager.startBuilding('BARRACKS')">Barracks (St:150)</button>
      <button onclick="structureManager.startBuilding('GUNSHIP')">Gunship Pad (St:400)</button>
      <button onclick="structureManager.startBuilding('SUPPLY_DEPOT')">Supply Depot (St:100)</button>
      <button onclick="structureManager.startBuilding('TURRET')">Defense Turret (St:100)</button>
      <button onclick="structureManager.startBuilding('WORKER_HUT')">Worker Hut (St:70)</button>
      <button onclick="structureManager.startBuilding('MEDIC_STATION')">Medic Station (St:100 Oil:50)</button>
      <hr style="border-color: #4a5568; width: 100%;" />
      <button onclick="structureManager.startBuilding('STEEL_MINE')">Steel Mine (St:70)</button>
      <button onclick="structureManager.startBuilding('OIL_PUMP')">Oil Pump (St:50)</button>
      <hr style="border-color: #4a5568; width: 100%;" />
      <button class="danger" onclick="structureManager.startDeconstructing()">Deconstruct (75% Refund)</button>
      <button class="cancel" onclick="structureManager.cancelAction()">Cancel Action</button>
    </div>
  </div>

  <script src="sceneManager.js"></script>
  <script src="worldMap.js"></script>
  <script src="structures.js"></script>
  <script src="npc.js"></script>
  <script src="missions.js"></script>
  <!-- Authentication UI -->
  <div id="auth-modal" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;">
    <div style="background: #1a202c; padding: 40px; border-radius: 8px; border: 1px solid #4a5568; width: 300px; text-align: center; position: relative;">

      <!-- Main Menu -->
      <div id="auth-main-menu">
        <h2 style="margin-top: 0;">Welcome</h2>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
          <button id="nav-login-btn" style="padding: 12px 20px; background: #4299e1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Log in</button>
          <button id="nav-signup-btn" style="padding: 12px 20px; background: #48bb78; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Sign up</button>
          <button id="nav-settings-btn" style="padding: 12px 20px; background: #4a5568; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Settings</button>
        </div>
      </div>

      <!-- Auth Form (Hidden by default) -->
      <div id="auth-form-menu" style="display: none;">
        <button id="auth-back-btn" style="position: absolute; top: 15px; left: 15px; background: none; border: none; color: #a0aec0; cursor: pointer; font-size: 14px;">&#8592; Back</button>
        <h2 id="auth-title" style="margin-top: 0;"></h2>
        <input type="email" id="auth-email" placeholder="Email" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border-radius: 4px; border: 1px solid #718096; background: #2d3748; color: white;" />
        <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; border-radius: 4px; border: 1px solid #718096; background: #2d3748; color: white;" />

        <button id="auth-submit-btn" style="padding: 10px 20px; background: #4299e1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;"></button>

        <div id="auth-error" style="color: #fc8181; margin-top: 15px; font-size: 14px;"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseConfig.js"></script>
  <script src="auth.js"></script>

  <script src="camera.js"></script>
  
  <script>
    let isInitialized = false;

    // Delay initialization until authentication succeeds
    window.onAuthSuccess = async function() {
      if (isInitialized) return;
      isInitialized = true;

      // Fetch world seed from Supabase
      let seed = '12345';
      if (window.supabaseClient) {
        const { data, error } = await window.supabaseClient
          .from('settings')
          .select('value')
          .eq('id', 'world_seed')
          .single();
        if (data && data.value) {
          seed = data.value;
        }
      }

      window.sceneManager = new SceneManager();
      window.worldMap = new WorldMap(20, 20, seed);

      const canvas = document.getElementById('myCanvas');
      initCamera(canvas);

      window.npcManager = new NPCManager(structureManager);
      window.missionManager = new MissionManager(structureManager, window.npcManager);

      if (window.supabaseClient && window.currentUser) {
        window.worldMap.fetchOtherPlayers();
        // Ensure player record exists
        let { data: player, error: playerError } = await window.supabaseClient
          .from('players')
          .select('*')
          .eq('id', window.currentUser.id)
          .single();

        if (!player) {
          // New player: create record with random overworld coords
          const newPlayer = {
            id: window.currentUser.id,
            email: window.currentUser.email,
            hex_x: Math.floor(Math.random() * 20),
            hex_y: Math.floor(Math.random() * 20)
          };
          const { data: insertedPlayer, error: insertError } = await window.supabaseClient
            .from('players')
            .insert(newPlayer)
            .select()
            .single();
          player = insertedPlayer || newPlayer;
        }

        window.currentUser.hex_x = player.hex_x;
        window.currentUser.hex_y = player.hex_y;

        // Fetch buildings
        const { data: buildingsData } = await window.supabaseClient
          .from('buildings')
          .select('*')
          .eq('player_id', window.currentUser.id);

        // Fetch workers
        const { data: workersData } = await window.supabaseClient
          .from('workers')
          .select('*')
          .eq('player_id', window.currentUser.id);

        if ((!buildingsData || buildingsData.length === 0) && (!workersData || workersData.length === 0)) {
          // Initial base setup
          const hq = new Structure('HEADQUARTERS', -75, -75);
          const { data: hqData } = await window.supabaseClient
            .from('buildings')
            .insert({
              player_id: window.currentUser.id,
              type_id: hq.type.id,
              x: hq.x,
              y: hq.y,
              health: hq.health
            })
            .select()
            .single();

          if (hqData) {
            hq.dbId = hqData.id;
            hq.construction_started_at = hqData.construction_started_at;
          }
          structureManager.buildings = [hq];

          const spawnPoints = [];
          for(let i = 0; i < 3; i++) {
            const spawnX = hq.x + hq.type.width / 2 + (Math.random() * 40 - 20);
            const spawnY = hq.y + hq.type.height + 20 + (Math.random() * 20);
            spawnPoints.push({ x: spawnX, y: spawnY });
          }

          for (const sp of spawnPoints) {
            const { data: workerData } = await window.supabaseClient
              .from('workers')
              .insert({
                player_id: window.currentUser.id,
                type_id: 'WORKER',
                x: sp.x,
                y: sp.y,
                health: 50
              })
              .select()
              .single();

            const newWorker = new NPC(NPC_TYPES.WORKER, sp.x, sp.y);
            if (workerData) {
              newWorker.dbId = workerData.id;
              newWorker.training_started_at = workerData.training_started_at;
            }
            window.npcManager.npcs.push(newWorker);
            window.npcManager.counts.worker++;
          }
        } else {
          // Load existing base
          structureManager.buildings = [];
          if (buildingsData) {
            buildingsData.forEach(bData => {
              const b = new Structure(bData.type_id, bData.x, bData.y);
              b.dbId = bData.id;
              b.health = bData.health;
              b.construction_started_at = bData.construction_started_at;
              structureManager.buildings.push(b);
            });
          }

          window.npcManager.npcs = [];
          window.npcManager.counts = { worker: 0, soldier: 0, medic: 0 };
          if (workersData) {
            workersData.forEach(wData => {
              const typeKey = wData.type_id.toUpperCase();
              const typeObj = NPC_TYPES[typeKey];
              if (typeObj) {
                const w = new NPC(typeObj, wData.x, wData.y);
                w.dbId = wData.id;
                w.health = wData.health;
                w.training_started_at = wData.training_started_at;
                window.npcManager.npcs.push(w);
                window.npcManager.counts[typeKey.toLowerCase()]++;
              }
            });
          }
        }

        structureManager.updateResourceUI();
        window.npcManager.updateUI();
      }
    };

    function toggleDevMode() {
      const isDev = structureManager.toggleDevMode();
      const btn = document.getElementById('dev-btn');
      btn.innerText = `Dev Mode: ${isDev ? 'ON' : 'OFF'}`;
      btn.style.backgroundColor = isDev ? '#48bb78' : '#2d3748';
    }

    function toggleBuildMenu() {
      const content = document.getElementById('build-menu-content');
      const toggleIcon = document.getElementById('build-toggle');
      
      if (content.style.display === 'none') {
        content.style.display = 'flex';
        toggleIcon.innerText = '▼';
      } else {
        content.style.display = 'none';
        toggleIcon.innerText = '▶';
      }
    }
  </script>
</body>
</html>
